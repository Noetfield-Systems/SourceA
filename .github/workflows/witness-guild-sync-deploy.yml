name: Witness Web3 Canonical Artifact
on:
  push:
    branches: [main]
    paths:
      - 'witnessbc-site/**'
      - '.github/workflows/witness-guild-sync-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate only canonical Web3 pages
        run: |
          cd witnessbc-site
          node scripts/build-web3.mjs
          node scripts/verify-web3.mjs
      - name: Publish immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: witness-web3-genesis-production-source
          path: witnessbc-site/dist/deploy/
          retention-days: 21
      - name: Declare source of truth
        run: |
          echo "SourceA is the only authoritative Witness source."
          echo "Vercel builds the existing project directly from SourceA; no retired deploy token or old mirror push."
          echo "This job alone does not claim a production release."
