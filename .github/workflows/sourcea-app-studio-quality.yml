name: SourceA App Studio Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'sites/SourceA-landing/green-unified/**'
      - 'scripts/sourcea_clean_urls_v1.py'
      - 'scripts/validate_sourcea_app_studio_v1.py'
      - 'scripts/sourcea_app_studio_browser_qa.cjs'
      - 'scripts/sync_sourcea_platform_auth_public_v1.py'
      - 'scripts/test_sourcea_public_auth_sync_v1.py'
      - 'vercel.json'
      - '.github/workflows/sourcea-app-studio-quality.yml'
  push:
    branches: [main]
    paths:
      - 'sites/SourceA-landing/green-unified/**'
      - 'scripts/sourcea_clean_urls_v1.py'
      - 'scripts/validate_sourcea_app_studio_v1.py'
      - 'scripts/sourcea_app_studio_browser_qa.cjs'
      - 'scripts/sync_sourcea_platform_auth_public_v1.py'
      - 'scripts/test_sourcea_public_auth_sync_v1.py'
      - 'vercel.json'
      - '.github/workflows/sourcea-app-studio-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-level app studio contract, accessibility and independent ventures
        run: python3 scripts/validate_sourcea_app_studio_v1.py
      - name: Verify publishable auth configuration fallback without secrets
        run: python3 scripts/test_sourcea_public_auth_sync_v1.py
      - name: Verify Vercel builds fresh content and keeps app routes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("vercel.json").read_text())
          assert "build_sourcea_vercel_output_v1.py" in cfg["buildCommand"]
          assert cfg["outputDirectory"]=="SourceA-landing/green-unified/dist"
          assert cfg["cleanUrls"] is True
          routes={r["source"]:r["destination"] for r in cfg["rewrites"]}
          assert routes["/apps"]=="/sourcea/app-studio.html"
          assert routes["/forge/terminal"]=="/sourcea/forge/terminal.html"
          assert all(r["source"]!="/" for r in cfg["rewrites"])
          print("PASS: build generates current dist and preserves app/forge routes")
          PY
      - name: Build full production static pages with auth domain gate enforced
        run: python3 scripts/build_sourcea_vercel_output_v1.py --json
      - name: Verify generated route, teaser and source-of-truth
        run: |
          set -euo pipefail
          test -s SourceA-landing/green-unified/dist/sourcea/app-studio.html
          test -s SourceA-landing/green-unified/dist/sourcea/app-studio.css
          test -s SourceA-landing/green-unified/dist/sourcea/app-studio-teaser.css
          grep -q 'id="next-generation-apps"' SourceA-landing/green-unified/dist/index.html
          grep -q '^/apps  /sourcea/app-studio  302$' SourceA-landing/green-unified/dist/_redirects
          grep -q 'The next generation of apps' SourceA-landing/green-unified/dist/index.html
          echo "PASS: generated homepage, public app studio and route alias"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright Chromium
        run: |
          npm install --prefix /tmp/sourcea-playwright --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/sourcea-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser QA, real responsive screenshots
        run: |
          python3 -m http.server 8765 --directory SourceA-landing/green-unified/dist >/tmp/sourcea-http.log 2>&1 &
          sleep 2
          SOURCEA_QA_URL=http://127.0.0.1:8765 \
          SOURCEA_QA_SCREENSHOTS=/tmp/sourcea-app-studio-screenshots \
          NODE_PATH=/tmp/sourcea-playwright/node_modules \
          node scripts/sourcea_app_studio_browser_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcea-app-studio-responsive-qa
          path: /tmp/sourcea-app-studio-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
