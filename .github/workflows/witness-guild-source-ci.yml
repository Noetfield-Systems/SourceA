name: Witness Community + Dignity CI
on:
  pull_request:
    paths:
      - 'witnessbc-site/**'
      - '.github/workflows/witness-guild-source-ci.yml'
  push:
    branches: [main]
    paths:
      - 'witnessbc-site/**'
      - '.github/workflows/witness-guild-source-ci.yml'
permissions:
  contents: read
jobs:
  genesis-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact Web3 site generator and browser code
        run: |
          node --check witnessbc-site/scripts/build-web3.mjs
          node --check witnessbc-site/web3/assets/app.js
          node --check witnessbc-site/scripts/verify-web3.mjs
          node --check witnessbc-site/scripts/verify-web3-browser.mjs
          node --check witnessbc-site/web3/assets/dignity.js
          node --check witnessbc-site/api/dignity/report.js
          node --check witnessbc-site/api/dignity/status.js
          node --check witnessbc-site/api/dignity/admin.js
          node --check witnessbc-site/api/dignity/routes.js
          node --check witnessbc-site/lib/dignity-stream.mjs
      - name: Build the community and dignity publication allowlist
        run: cd witnessbc-site && node scripts/build-web3.mjs && node scripts/verify-web3.mjs
      - name: Ensure corporate checkout and old pages are not published
        run: |
          test ! -f witnessbc-site/dist/deploy/pricing.html
          test ! -f witnessbc-site/dist/deploy/toolkits.html
          test ! -f witnessbc-site/dist/deploy/proof.html
          if grep -RniE 'buy[.]stripe[.]com|noetfield[.]com|mailto:|institutional alignment' witnessbc-site/dist/deploy --include='*.html'; then
            echo "::error::Forbidden legacy content in Witness Web3 release"
            exit 1
          fi
          test "$(find witnessbc-site/dist/deploy -name '*.html' | wc -l)" -eq 24
      - name: Test schema, receipt and anti-abuse validation
        run: cd witnessbc-site && node --test tests/*.test.mjs
      - name: Install Chromium browser runtime
        run: |
          cd witnessbc-site
          npm install --no-package-lock --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile Witness journeys
        run: |
          node witnessbc-site/scripts/serve-web3.mjs >/tmp/witness-web3-http.log 2>&1 &
          node witnessbc-site/scripts/verify-web3-browser.mjs
      - name: Archive only the vetted Web3 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: witnessbc-dignity-public-artifacts
          path: witnessbc-site/dist/deploy/
          retention-days: 14
