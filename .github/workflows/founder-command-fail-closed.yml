name: Founder Command Fail-Closed Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/forge_swarm_blackboard_v1.py"
      - "scripts/forge_agent_kernel_v1.py"
      - "scripts/forge_agent_kernel_v3_swarm.py"
      - "scripts/forge_prompt_os_compiler_v2.py"
      - "scripts/forge_prompt_os_compiler_v3.py"
      - "scripts/validate_founder_command_fail_closed_v1.py"
      - ".github/workflows/founder-command-fail-closed.yml"

permissions:
  contents: read

jobs:
  fail-closed-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile touched Python modules
        run: |
          python -m py_compile \
            scripts/forge_swarm_blackboard_v1.py \
            scripts/forge_agent_kernel_v1.py \
            scripts/forge_agent_kernel_v3_swarm.py \
            scripts/forge_prompt_os_compiler_v2.py \
            scripts/forge_prompt_os_compiler_v3.py \
            scripts/validate_founder_command_fail_closed_v1.py
      - name: Run fail-closed regression suite
        run: python scripts/validate_founder_command_fail_closed_v1.py
